version: '3.8'

services:
  airflow-local:
    image: apache/airflow:2.6.3-python3.10
    container_name: airflow_selic_challenge
    command: standalone
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas pyarrow requests
      - PYTHONPATH=/opt/airflow/workspace
    volumes:
      - ./dags:/opt/airflow/dags
      - ./bronze:/opt/airflow/workspace/bronze
      - ./silver:/opt/airflow/workspace/silver
      - ./gold:/opt/airflow/workspace/gold
      - ./data:/opt/airflow/workspace/data
    restart: always
