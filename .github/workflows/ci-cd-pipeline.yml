name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Linter (flake8)
        run: |
          flake8 bronze silver gold scripts tests

      - name: Run Unit Tests with Coverage (pytest)
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=bronze --cov=silver --cov=gold --cov-fail-under=80
